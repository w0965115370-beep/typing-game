<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小小打字王</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bpmf+Zihi+Kai+Std&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fff8ec; --card: #ffffff; --ink: #3b2f2a; --muted: #8a7b70;
    --accent: #ff8a3d; --ok: #2e9e5b; --bad: #e5484d; --line: #f0e2cc;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif; }
  main { max-width: 900px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 40px; margin: 8px 0 4px; text-align: center; }
  .sub { text-align: center; color: var(--muted); margin: 0 0 24px; font-size: 18px; }
  .tabs { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; flex-wrap: wrap; }
  button { font: inherit; cursor: pointer; border: 0; border-radius: 14px; }
  .tab { padding: 12px 22px; font-size: 20px; background: var(--card); border: 3px solid var(--line); }
  .tab[aria-pressed="true"] { border-color: var(--accent); background: #ffe9d6; }
  .list { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
  .card { text-align: left; padding: 18px; font-size: 22px; background: var(--card);
    border: 3px solid var(--line); }
  .card:hover, .card:focus-visible { border-color: var(--accent); }
  .card small { display: block; color: var(--muted); font-size: 16px; margin-top: 6px; }
  .bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
  .back { padding: 10px 18px; font-size: 18px; background: var(--card); border: 3px solid var(--line); }
  .stats { font-size: 20px; color: var(--muted); }
  .text { background: var(--card); border: 3px solid var(--line); border-radius: 18px;
    padding: 20px; font-size: 40px; line-height: 2.1;
    font-family: "Bpmf Zihi Kai Std", "DFKai-SB", "BiauKai", serif; } /* 字型自帶注音 */
  .text span.ok { color: var(--ok); }
  .text span.bad { color: #fff; background: var(--bad); border-radius: 6px; }
  .text span.cur { border-bottom: 4px solid var(--accent); }
  textarea { width: 100%; margin-top: 16px; font: inherit; font-size: 30px; padding: 16px;
    border: 3px solid var(--accent); border-radius: 18px; min-height: 140px; resize: vertical;
    background: var(--card); color: var(--ink); }
  .tip { color: var(--muted); font-size: 17px; margin-top: 8px; }
  .result { text-align: center; background: var(--card); border: 3px solid var(--line);
    border-radius: 18px; padding: 28px 16px; margin-top: 16px; }
  .stars { font-size: 56px; letter-spacing: 6px; }
  .result p { font-size: 24px; margin: 8px 0; }
  .big { padding: 14px 26px; font-size: 22px; background: var(--accent); color: #fff; margin: 12px 6px 0; }
  .track { position: relative; height: 60px; margin-bottom: 14px; border-radius: 30px;
    background: repeating-linear-gradient(90deg, #d8f0c8 0 40px, #c8e8b4 40px 80px); }
  #runner { position: absolute; top: 6px; font-size: 40px; transition: left .3s;
    left: calc(var(--p, 0) * (100% - 60px)); transform: scaleX(-1); }
  .goal { position: absolute; right: 10px; top: 6px; font-size: 40px; }
  .combo { font-size: 26px; font-weight: bold; color: var(--accent); min-height: 36px; text-align: center; }
  .pop { animation: pop .3s; }
  @keyframes pop { 50% { transform: scale(1.4); } }
  .shake { animation: shake .3s; }
  @keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
  .confetti { position: fixed; top: -50px; font-size: 30px; pointer-events: none;
    animation: fall 2.4s linear forwards; }
  @keyframes fall { to { transform: translateY(115vh) rotate(540deg); } }
  .stars span { display: inline-block; animation: pop .5s backwards; }
  @media (prefers-reduced-motion: reduce) { *, .confetti { animation: none !important; transition: none !important; } .confetti { display: none; } }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <section id="home">
    <h1>⌨️ 小小打字王</h1>
    <p class="sub">選一篇文章，用注音輸入法照著打打看！</p>
    <div class="tabs" id="tabs"></div>
    <div class="list" id="list"></div>
  </section>

  <section id="play" hidden>
    <div class="bar">
      <button class="back" id="back">← 選文章</button>
      <div class="stats"><span id="live">時間 0 秒</span>
        <button class="back" id="mute" aria-label="聲音開關">🔊</button></div>
    </div>
    <h2 id="title"></h2>
    <div class="track"><span id="runner">🐰</span><span class="goal">🥕</span></div>
    <div class="combo" id="combo" aria-live="polite"></div>
    <div class="text" id="text"></div>
    <textarea id="input" placeholder="在這裡打字…" autocomplete="off" spellcheck="false"></textarea>
    <p class="tip">小提示：逗號「，」按 Shift + &lt;，句號「。」按 Shift + &gt;</p>
    <div class="result" id="result" hidden>
      <div class="stars" id="stars"></div>
      <p id="msg"></p>
      <p id="detail"></p>
      <button class="big" id="again">再打一次</button>
      <button class="big" id="other">換一篇</button>
    </div>
  </section>
</main>

<script>
const LEVELS = {
  "簡單": [
    ["小黃狗", "我家有一隻小黃狗。牠喜歡在院子裡跑來跑去，看到我回家，就會開心的搖尾巴。"],
    ["下雨天", "今天下雨了，我穿上雨衣，撐著小花傘。路上的水坑好多，我小心的走到學校。"],
    ["早餐", "早上媽媽做了蛋餅和豆漿。我吃得飽飽的，背起書包，跟媽媽說再見。"],
    ["放風箏", "星期天，爸爸帶我去公園。我們一起放風箏，風箏飛得好高好高。"],
    ["小花", "窗台上有一盆小花。我每天幫它澆水，它開出了紅色的花，真漂亮。"],
  ],
  "中等": [
    ["我的好朋友", "我的好朋友叫小明，他住在我家隔壁。我們每天一起上學，下課時一起玩躲避球。有一次我忘了帶鉛筆，他馬上借給我。我覺得有好朋友真好。"],
    ["去動物園", "放假的時候，全家人一起去動物園。我看到了長頸鹿，牠的脖子好長，可以吃到樹上的葉子。我還看到大象用鼻子噴水，大家都笑了。"],
    ["種豆子", "老師請我們在杯子裡種豆子。我每天幫豆子澆水，還把它放在有陽光的地方。過了幾天，豆子長出綠綠的小芽，我高興得跳了起來。"],
    ["大掃除", "今天是大掃除的日子。我負責擦窗戶，小美負責掃地，大家分工合作。打掃完以後，教室變得又乾淨又明亮，老師稱讚我們很棒。"],
    ["中秋節", "中秋節晚上，我們在頂樓烤肉。月亮又大又圓，像一個白色的盤子。奶奶切了柚子，還說了嫦娥奔月的故事給我們聽。"],
  ],
  "挑戰": [
    ["學騎腳踏車", "暑假的時候，爸爸教我騎腳踏車。一開始我很害怕，車子一直搖來搖去，還跌倒了好幾次，膝蓋都破皮了。爸爸鼓勵我不要放棄，他在後面扶著車子，陪我一圈一圈的練習。終於，我可以自己騎了。風吹在臉上涼涼的，我覺得自己好厲害。"],
    ["圖書館", "學校的圖書館裡有好多好多書。每個星期三，老師會帶我們去借書。我最喜歡看恐龍的書，因為恐龍有大有小，有的吃草，有的吃肉。看完書以後，我會把書放回原來的地方，讓下一個同學也能找到。圖書館是我最喜歡的地方。"],
    ["小烏龜慢慢", "哥哥送我一隻小烏龜，我幫牠取名叫慢慢。慢慢的殼是綠色的，上面有一格一格的花紋。牠很喜歡吃菜葉，吃東西的時候嘴巴動來動去，樣子很可愛。天氣冷的時候，牠會把頭縮進殼裡睡覺。我每天放學回家，第一件事就是去看慢慢。"],
    ["運動會", "學校舉辦運動會，我參加了大隊接力。比賽開始了，同學們一棒接一棒，大家都跑得好快。輪到我的時候，我緊緊握住接力棒，用力往前衝。雖然我們最後得到第二名，但是大家都很開心，因為我們已經盡力了。老師說，合作比輸贏更重要。"],
    ["幫媽媽做家事", "星期六早上，媽媽生病了，躺在床上休息。我想要幫媽媽的忙，就自己摺好棉被，還把客廳的地板掃乾淨。中午，我和爸爸一起煮了麵，端到媽媽的床邊。媽媽吃了一口，笑著說這是她吃過最好吃的麵。我覺得能幫助家人，是一件很快樂的事。"],
  ],
};

// 逐字比對：回傳正確字數（打的字去掉空白後，跟原文同位置比較）
function score(target, typed) {
  typed = typed.replace(/\s/g, "");
  let ok = 0;
  for (let i = 0; i < typed.length && i < target.length; i++) if (typed[i] === target[i]) ok++;
  return { typed, ok };
}
console.assert(score("我家有狗", "我 家有").ok === 3, "score: 忽略空白");
console.assert(score("我家有狗", "我加有狗").ok === 3, "score: 錯字不算");

const $ = id => document.getElementById(id);
let level = "簡單", current = null, start = 0, timer = 0, composing = false;
let prevLen = 0, combo = 0, best = 0, muted = false, audio;

// 音效用 Web Audio 現場合成，不需要音檔
function beep(freq, dur, type = "sine") {
  if (muted) return;
  audio ??= new AudioContext();
  const o = audio.createOscillator(), g = audio.createGain(), t = audio.currentTime;
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0.15, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(audio.destination); o.start(); o.stop(t + dur);
}
function replay(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
function confetti(n) {
  for (let i = 0; i < n; i++) {
    const c = document.createElement("span");
    c.className = "confetti"; c.textContent = [..."⭐🎉✨🌟🥕"][i % 5];
    c.style.left = Math.random() * 100 + "vw"; c.style.animationDelay = Math.random() + "s";
    document.body.append(c); setTimeout(() => c.remove(), 3500);
  }
}

function showHome() {
  clearInterval(timer);
  $("play").hidden = true; $("home").hidden = false;
  $("tabs").innerHTML = ""; $("list").innerHTML = "";
  for (const name of Object.keys(LEVELS)) {
    const b = document.createElement("button");
    b.className = "tab"; b.textContent = name;
    b.setAttribute("aria-pressed", name === level);
    b.onclick = () => { level = name; showHome(); };
    $("tabs").append(b);
  }
  for (const [title, text] of LEVELS[level]) {
    const b = document.createElement("button");
    b.className = "card";
    b.innerHTML = `${title}<small>${text.length} 個字</small>`;
    b.onclick = () => startGame(title, text);
    $("list").append(b);
  }
}

function startGame(title, text) {
  current = { title, text };
  clearInterval(timer); start = 0; prevLen = 0; combo = 0; best = 0;
  $("combo").textContent = ""; $("runner").style.setProperty("--p", 0);
  $("home").hidden = true; $("play").hidden = false; $("result").hidden = true;
  $("title").textContent = title;
  $("text").innerHTML = [...text].map(c => `<span>${c}</span>`).join("");
  $("input").value = ""; $("input").disabled = false; $("input").focus();
  $("live").textContent = "時間 0 秒";
  update();
}

function seconds() { return start ? Math.max(1, Math.round((Date.now() - start) / 1000)) : 0; }

function update() {
  if (composing) return; // 注音還在選字時先不判斷
  const { text } = current;
  const { typed, ok } = score(text, $("input").value);
  if (typed && !start) {
    start = Date.now();
    timer = setInterval(() => $("live").textContent = `時間 ${seconds()} 秒`, 500);
  }
  let wrong = false;
  for (let i = prevLen; i < typed.length && i < text.length; i++) {
    if (typed[i] === text[i]) best = Math.max(best, ++combo);
    else { combo = 0; wrong = true; }
  }
  if (typed.length > prevLen) {
    if (wrong) { beep(150, .25, "square"); replay($("text"), "shake"); }
    else beep(660 + Math.min(combo, 20) * 25, .12); // 連擊越多，聲音越高
    $("combo").textContent = combo >= 3 ? `🔥 連擊 ${combo}${combo % 10 === 0 ? "　太神啦！" : ""}` : "";
    replay($("combo"), "pop");
  }
  prevLen = typed.length;
  $("runner").style.setProperty("--p", Math.min(1, typed.length / text.length));
  $("text").querySelectorAll("span").forEach((s, i) => {
    s.className = i < typed.length ? (typed[i] === text[i] ? "ok" : "bad") : i === typed.length ? "cur" : "";
  });
  if (typed.length >= text.length) finish(ok);
}

function finish(ok) {
  clearInterval(timer);
  const sec = seconds(), total = current.text.length;
  const acc = Math.round(ok / total * 100);
  const speed = Math.round(ok / (sec / 60));
  const stars = acc >= 95 ? 3 : acc >= 80 ? 2 : 1;
  $("input").disabled = true;
  $("stars").innerHTML = [0, 1, 2].map(i => `<span style="animation-delay:${i * .3}s">${i < stars ? "⭐" : "☆"}</span>`).join("");
  [523, 659, 784, 1047].slice(0, stars + 1).forEach((f, i) => setTimeout(() => beep(f, .3), i * 150));
  confetti(stars * 15);
  $("msg").textContent = ["加油，再試一次！", "很不錯喔！", "太厲害了！"][stars - 1];
  $("detail").textContent = `花了 ${sec} 秒 · 正確率 ${acc}% · 每分鐘 ${speed} 個字 · 最高連擊 ${best}`;
  $("result").hidden = false;
}

const input = $("input");
input.addEventListener("compositionstart", () => composing = true);
input.addEventListener("compositionend", () => { composing = false; update(); });
input.addEventListener("input", update);
input.addEventListener("paste", e => e.preventDefault()); // 不能貼上，要自己打
$("mute").onclick = () => { muted = !muted; $("mute").textContent = muted ? "🔇" : "🔊"; };
$("back").onclick = $("other").onclick = showHome;
$("again").onclick = () => startGame(current.title, current.text);
showHome();
</script>
</body>
</html>
